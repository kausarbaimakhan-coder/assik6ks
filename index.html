<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment 6 - JavaScript Basics</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Assignment 6: JavaScript Basics</h1>

    <p id="paragraph">I want to go home</p>
    <button id="changeTextBtn">Change Text</button>

    <div id="styleBox">
        <p>I wanna go home</p>
    </div>
    <button id="changeBgBtn">Change Background</button>
    <button id="changeFontBtn">Change Font Size</button>

    <ul id="itemList">
        <li>BMW</li>
        <li>Toyota</li>
    </ul>
    <button id="addItemBtn">Add Car</button>
    <button id="removeItemBtn">Remove Last Car</button>

    <!-- Updated colorBox with text inside -->
    <div id="colorBox">
        <p id="hoverText">Hover over me!</p>
    </div>

    <input type="text" id="inputField" placeholder="Type something..." />
    <p>Current Input: <span id="displayInput"></span></p>

    <form id="simpleForm">
        <h3>Registration Form</h3>
        <input type="text" id="name" placeholder="Name" />
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button type="submit">Submit</button>
        <p id="error" style="color:red;"></p>
    </form>

    <h2>Mini Project: To‑Do List</h2>
    <input type="text" id="taskInput" placeholder="Add a task" />
    <button id="addTaskBtn">Add Task</button>
    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
</html>
